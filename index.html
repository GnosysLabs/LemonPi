<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f0e6" />
    <meta name="color-scheme" content="light dark" />
    <title>LemonPi</title>
    <style>
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      body { background: #ebe8df; }
      .startup-splash {
        position: fixed;
        z-index: 1000;
        inset: 0;
        display: grid;
        place-items: center;
        background: #ebe8df;
      }
      .startup-splash__logo { display: block; width: min(250px, 38vw); height: auto; }
      @media (prefers-color-scheme: dark) {
        body, .startup-splash { background: #151613; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-splash" role="status" aria-live="polite" aria-label="Loading LemonPi" aria-busy="true">
        <img class="startup-splash__logo" src="./assets/piwm.png" alt="" />
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
