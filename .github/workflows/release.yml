name: Release LemonPi all-platform fallback

# The primary release path is built locally on macOS and remotely on Windows.
# This optional workflow is intentionally manual-only so a pushed tag cannot race it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag for the optional all-platform fallback (for example, v0.1.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: lemonpi-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require one version and a matching tag
        run: node scripts/verify-release-version.mjs --tag "$RELEASE_TAG"

  prepare-release:
    name: Create draft release
    needs: validate
    runs-on: ubuntu-22.04
    outputs:
      release-id: ${{ steps.release.outputs.release-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Create or reuse the release draft
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            release_id="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq '.databaseId')"
          else
            version="$(node scripts/verify-release-version.mjs --tag "$RELEASE_TAG")"
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --title "LemonPi v${version}" --notes "Signed desktop installers and updater artifacts."
            release_id="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq '.databaseId')"
          fi
          test -n "$release_id"
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: prepare-release
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            runner: macos-13
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: macOS Apple Silicon
            runner: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: Windows x64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            wget
      - name: Revalidate the release tag
        run: node scripts/verify-release-version.mjs --tag "$RELEASE_TAG"
      - name: Build and upload signed artifacts
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release-id }}
          projectPath: .
          args: --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          uploadUpdaterJson: false
          uploadUpdaterSignatures: true
          retryAttempts: 2

  publish-manifest:
    name: Publish update manifest
    needs: [prepare-release, build]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the signatures from the completed draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir signatures
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.sig" --dir signatures
          gh api "repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare-release.outputs.release-id }}/assets?per_page=100" > release-assets.json
      - name: Generate a complete static updater manifest
        run: |
          set -euo pipefail
          version="$(node scripts/verify-release-version.mjs --tag "$RELEASE_TAG")"
          node scripts/create-updater-manifest.mjs \
            --version "$version" \
            --tag "$RELEASE_TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --release-assets release-assets.json \
            --signature-directory signatures \
            --output latest.json
      - name: Publish manifest and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
