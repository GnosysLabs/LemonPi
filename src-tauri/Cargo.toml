[package]
name = "lemonpi"
version = "0.1.2"
description = "A native desktop workspace for Pi"
authors = ["LemonPi contributors"]
edition = "2021"

[lib]
name = "lemonpi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = "0.8.8"
base64 = "0.22.1"
hostname = "0.4.2"
hyper = { version = "1.6.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.10", features = ["server-auto", "service", "tokio"] }
if-addrs = "0.15.0"
rand = "0.8.5"
rcgen = { version = "0.13.2", default-features = false, features = ["ring"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.8"
subtle = "2.6.1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-process = "2.3.1"
tauri-plugin-updater = "2.10.1"
time = { version = "0.3.44", features = ["formatting"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.26.4"
tower = { version = "0.5.2", features = ["util"] }
uuid = { version = "1.12.1", features = ["v4"] }
which = "8.0.5"

[dev-dependencies]
tempfile = "3.14.0"
